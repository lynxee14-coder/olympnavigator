<title>Олимпиадный навигатор 2026/27</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Sofia+Sans+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: липкая шапка с вкладками и поиском; под ней один рабочий столбец шириной до 1080px.
   Каждая запись — строка-«протокол»: медаль уровня слева, название, срок, статус; детали раскрываются. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#131E2C; --muted:#566376; --line:#D3D9E2;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --accent-soft:#E2E9FB;
  --gold:#7A5400; --gold-bg:#FAEBBE; --silver:#4B5664; --silver-bg:#E1E6EC; --bronze:#84431A; --bronze-bg:#F4DCCA;
  --urgent:#A83408; --urgent-bg:#FDE1D1; --open:#155F43; --open-bg:#D5EFE1; --closed:#6B4F58; --closed-bg:#EDE3E6; --wait:#35527A; --wait-bg:#DCE6F3;
  --display:"Sofia Sans Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E141C; --surface:#161F2B; --surface-2:#1B2633; --ink:#E7ECF2; --muted:#98A5B6; --line:#2C3949;
  --accent:#8FAEFF; --accent-ink:#0E141C; --accent-soft:#1D2B49;
  --gold:#F2C552; --gold-bg:#3A2E0E; --silver:#C6CFDB; --silver-bg:#2B3542; --bronze:#EBA06B; --bronze-bg:#3C2415;
  --urgent:#FFA077; --urgent-bg:#41200F; --open:#75D6A8; --open-bg:#11362A; --closed:#C7ABB4; --closed-bg:#34272C; --wait:#A3BEE0; --wait-bg:#1C2B3E;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E141C; --surface:#161F2B; --surface-2:#1B2633; --ink:#E7ECF2; --muted:#98A5B6; --line:#2C3949;
  --accent:#8FAEFF; --accent-ink:#0E141C; --accent-soft:#1D2B49;
  --gold:#F2C552; --gold-bg:#3A2E0E; --silver:#C6CFDB; --silver-bg:#2B3542; --bronze:#EBA06B; --bronze-bg:#3C2415;
  --urgent:#FFA077; --urgent-bg:#41200F; --open:#75D6A8; --open-bg:#11362A; --closed:#C7ABB4; --closed-bg:#34272C; --wait:#A3BEE0; --wait-bg:#1C2B3E;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
a{color:var(--accent)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1080px;margin-inline:auto;padding-inline:16px}

/* шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:12px 0}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand span{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.search{flex:1 1 220px;min-width:0;display:flex}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px}
.search input::placeholder{color:var(--muted)}
.tabs-scroll{overflow-x:auto;scrollbar-width:none}
.tabs-scroll::-webkit-scrollbar{display:none}
.tabs{display:flex;gap:4px;padding-block:10px 0;width:max-content}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab i{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:5px}

main{padding-block:24px 56px}
.view{display:flex;flex-direction:column;gap:22px}
h1,h2,h3{margin:0;text-wrap:balance}
.h-view{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.05;letter-spacing:.01em;text-transform:uppercase}
.lead{color:var(--muted);max-width:68ch;margin:6px 0 0}
.h-group{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.03em;text-transform:uppercase;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.h-group small{font-family:var(--body);font-size:13px;font-weight:400;color:var(--muted);text-transform:none;letter-spacing:0}
.group{display:flex;flex-direction:column;gap:8px}

/* фильтры */
.filters{display:flex;flex-direction:column;gap:8px}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.frow > span{font-size:12px;color:var(--muted);width:92px;flex:none}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{font-size:13px;color:var(--muted)}
.count button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}

/* строки-записи */
.rec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.rec > summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:48px minmax(0,1fr) minmax(0,230px) 104px 16px;gap:14px;align-items:center;padding:12px 14px}
.rec > summary::-webkit-details-marker{display:none}
.rec > summary:hover .nm{color:var(--accent)}
.medal{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;line-height:1;border:2px solid currentColor}
.medal.I{color:var(--gold);background:var(--gold-bg)}
.medal.II{color:var(--silver);background:var(--silver-bg)}
.medal.III{color:var(--bronze);background:var(--bronze-bg)}
.medal.V{color:var(--accent-ink);background:var(--accent);border-color:var(--accent);font-size:15px;letter-spacing:.02em}
.medal.N{color:var(--muted);background:transparent;border-style:dashed;border-width:1.5px;font-size:13px;font-weight:600}
.medal.C{color:var(--accent);background:var(--accent-soft);border-color:transparent;border-radius:12px;font-size:15px;letter-spacing:.03em}
.ttl{min-width:0}
.nm{display:block;font-weight:600;font-size:15.5px;line-height:1.3}
.sub{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.dl-cell{min-width:0;font-size:13px;line-height:1.35}
.dl-cell span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:1px}
.pill{justify-self:start;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.s-urgent{color:var(--urgent);background:var(--urgent-bg)}
.pill.s-open{color:var(--open);background:var(--open-bg)}
.pill.s-closed{color:var(--closed);background:var(--closed-bg)}
.pill.s-wait{color:var(--wait);background:var(--wait-bg)}
.pill.s-none{color:var(--muted);background:var(--surface-2);border:1px solid var(--line)}
.chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;justify-self:center;margin-top:-4px}
.rec[open] .chev{transform:rotate(-135deg);margin-top:4px}
.body{border-top:1px solid var(--line);padding:16px 14px 16px 76px;display:flex;flex-direction:column;gap:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 28px;margin:0}
.facts > div{min-width:0}
.facts .wide{grid-column:1/-1}
.facts dt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.facts dd{margin:0;max-width:72ch;overflow-wrap:anywhere}
.gives dd{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.go{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;font-size:14px;border-radius:8px;padding:8px 14px;max-width:100%}
.go:hover{filter:brightness(1.08)}
.go small{font-family:var(--mono);font-weight:400;font-size:11.5px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}

/* главная */
.hot{display:flex;flex-direction:column;gap:6px}
.hot-row,.cal-row{display:grid;grid-template-columns:104px 108px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.date{font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.left{font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;justify-self:start;white-space:nowrap;font-variant-numeric:tabular-nums}
.left.now{color:var(--urgent);background:var(--urgent-bg)}
.left.soon{color:var(--open);background:var(--open-bg)}
.left.later{color:var(--wait);background:var(--wait-bg)}
.left.past{color:var(--muted);background:var(--surface-2)}
.ev{min-width:0}
.ev b{font-weight:600}
.ev .rel{display:block;font-size:12px;color:var(--muted)}
.ev .rel::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;border:1.5px solid var(--muted)}
.ev .rel.ok::before{background:var(--open);border-color:var(--open)}
.out{font-size:13px;white-space:nowrap}
.cal-row.is-past{opacity:.62}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.note{border-left:3px solid var(--accent);padding:2px 0 2px 14px}
.note h3{font-size:15px;font-weight:600;margin-bottom:4px}
.note p{margin:0;color:var(--muted);font-size:14px}
.jump{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.jump button{display:flex;justify-content:space-between;align-items:baseline;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;font-weight:600}
.jump button:hover{border-color:var(--accent);color:var(--accent)}
.jump button span{font-family:var(--mono);font-weight:400;font-size:13px;color:var(--muted)}

/* календарь */
.month{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;margin-top:6px}
.cal{display:flex;flex-direction:column;gap:6px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}

/* перечень */
.prose p{max-width:70ch;margin:0 0 10px}
.tbl-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
tr.g td{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.lv{display:inline-block;min-width:34px;text-align:center;font-family:var(--display);font-weight:800;font-size:15px;border-radius:6px;padding:1px 8px}
.lv.I{color:var(--gold);background:var(--gold-bg)} .lv.II{color:var(--silver);background:var(--silver-bg)} .lv.III{color:var(--bronze);background:var(--bronze-bg)} .lv.N{color:var(--muted);border:1px dashed var(--muted);font-size:12px;font-weight:600;font-family:var(--body)}
.src{display:flex;flex-direction:column;gap:6px;padding:0;margin:0;list-style:none;font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);align-items:center}
.legend .medal{width:26px;height:26px;font-size:13px;border-width:1.5px}
.legend .medal.V{font-size:9px}
.legend span{display:inline-flex;align-items:center;gap:7px}
footer{border-top:1px solid var(--line);padding-block:18px 8px;color:var(--muted);font-size:13px}
footer p{max-width:80ch;margin:0 0 6px}

@media (max-width:760px){
  .brand b{font-size:22px}
  .h-view{font-size:28px}
  .rec > summary{grid-template-columns:44px minmax(0,1fr) 16px;gap:8px 12px;align-items:start}
  .medal{width:44px;height:44px;font-size:20px}
  .medal.V,.medal.C{font-size:13px}
  .dl-cell{grid-column:2/3;grid-row:2}
  .rec > summary .pill{grid-column:2/3;grid-row:3}
  .chev{grid-column:3;grid-row:1;margin-top:6px}
  .body{padding:14px}
  .hot-row,.cal-row{grid-template-columns:auto minmax(0,1fr);gap:6px 10px}
  .hot-row .ev,.cal-row .ev{grid-column:1/-1}
  .hot-row .out,.cal-row .out{grid-column:1/-1}
  .frow > span{width:100%}
}
@media (prefers-reduced-motion:reduce){ .chev{transition:none} }
</style>

<script>
(function(){

];

      '<div class="frow"><span>Регистрация</span>' + chips("os", S.os, [["all","Любая"],["срочно","Срочно"],["открыта","Открыта"],["ждать","Ждать"],["закрыта","Закрыта"]]) + '</div>' +
    '</div>' + legend() +
    '<div class="count">Показано ' + list.length + ' из ' + D.olymp.length + (list.length < D.olymp.length ? ' · <button type="button" data-reset="1">сбросить фильтры</button>' : '') + '</div>' +
    (html || '<div class="empty">Ничего не найдено. Измените запрос или сбросьте фильтры.</div>');
}
function renderCases(){
  var list = fc(), html = "";
  CG.forEach(function(g){
    var rows = list.filter(function(o){ return o.g === g.key; });
    if (!rows.length) return;
    html += '<div class="group"><h2 class="h-group">' + g.label + '<small>' + g.hint + '</small></h2>' + rows.map(recCase).join("") + '</div>';
  });
  $("v-cases").innerHTML =
    '<div><h1 class="h-view">Кейс-чемпионаты</h1><p class="lead">Командные кейсы, бизнес-конкурсы и акселераторы для школьников. БВИ не даёт ни один — только баллы за достижения, гранты, деньги и портфолио.</p></div>' +
    '<div class="filters">' +
      '<div class="frow"><span>Где</span>' + chips("cg", S.cg, [["all","Все"],["ru","Россия"],["int","Международные"]]) + '</div>' +
      '<div class="frow"><span>Регистрация</span>' + chips("cs", S.cs, [["all","Любая"],["срочно","Срочно"],["открыта","Открыта"],["ждать","Ждать"],["закрыта","Закрыта"],["нет","Нет набора"]]) + '</div>' +
    '</div>' +
    '<div class="count">Показано ' + list.length + ' из ' + D.cases.length + (list.length < D.cases.length ? ' · <button type="button" data-reset="1">сбросить фильтры</button>' : '') + '</div>' +
    (html || '<div class="empty">Ничего не найдено. Измените запрос или сбросьте фильтры.</div>');
}
function renderCal(){
  var list = D.deadlines.filter(function(e){
    if (S.ck !== "all" && e.kind !== S.ck) return false;
    if (!S.past && days(e.b || e.a) < 0) return false;
    if (S.q && (e.name + " " + e.event).toLowerCase().indexOf(S.q) < 0) return false;
    return true;
  });
  var html = "", cur = "";
  list.forEach(function(e){
    var m = MONTHS[e.a.getMonth()] + " " + e.a.getFullYear();
    if (m !== cur){ cur = m; html += '<h2 class="month">' + m + '</h2>'; }
    html += calRow(e, "cal-row");
  });
  var hidden = D.deadlines.filter(function(e){ return days(e.b || e.a) < 0; }).length;
  $("v-cal").innerHTML =
    '<div><h1 class="h-view">Календарь</h1><p class="lead">Сроки регистрации и даты этапов по порядку. Зелёный кружок — дата подтверждена на официальном сайте, пустой — ориентир.</p></div>' +
    '<div class="filters"><div class="frow"><span>Показывать</span>' + chips("ck", S.ck, [["all","Всё"],["Олимпиады","Олимпиады"],["КЧ","Кейс-чемпионаты"]]) +
      '<label class="toggle"><input type="checkbox" id="past"' + (S.past ? " checked" : "") + '> прошедшие (' + hidden + ')</label></div></div>' +
    '<div class="cal">' + (html || '<div class="empty">Нет событий по этому условию.</div>') + '</div>' +
    '<p class="count">Без чисел в календаре: заключительный этап ВсОШ, МОШ, олимпиады Кондратьева и Колокольникова, Школьный акселератор Сбера, ТехноОлимп, Открытый чемпионат школ, IEO — организаторы ещё не объявили даты.</p>';
}
function renderList(){
  var rows = "";
  D.levels.forEach(function(g){
    rows += '<tr class="g"><td colspan="4">' + esc(g.group) + '</td></tr>';
    g.rows.forEach(function(r){
      var k = r[2] === "нет" ? "N" : r[2];
      rows += '<tr><td><b>' + esc(r[0]) + '</b></td><td>' + esc(r[1]) + '</td><td><span class="lv ' + k + '">' + (r[2] === "нет" ? "вне" : r[2]) + '</span></td><td>' + esc(r[3]) + '</td></tr>';
    });
  });
  $("v-list").innerHTML =
    '<div><h1 class="h-view">Перечень 2026/27</h1><p class="lead">Что изменилось в перечне РСОШ и какие уровни у профилей экономического блока.</p></div>' +
    '<div class="prose">' +
      '<p>Перечень утверждён приказом Минобрнауки России от 31.08.2026 № 521 (зарегистрирован в Минюсте 30.09.2026, № 88530).</p>' +
      '<p>В нём 60 олимпиад и 272 профиля. В августовском проекте было 79 олимпиад, в прошлом сезоне — 83. Дипломы исключённых олимпиад за 2026/27 льгот при поступлении не дают.</p>' +
      '<p>По экономическому блоку из перечня выпали «Финатлон для старшеклассников», олимпиада по экономике «Сибириада. Шаг в мечту» и Всероссийская олимпиада школьников по предпринимательству. В списке 60 олимпиад также нет олимпиады им. Кондратьева, олимпиады РУДН и DANO.</p>' +
      '<p>Уровни взяты из каталога перечня и сверены с сайтами ВШЭ, РАНХиГС и Финуниверситета. Официальный текст приказа открыть не удалось, поэтому перед решениями сверьте по первой ссылке в источниках. По «Сибириаде» и «Финатлону» есть расхождение с календарём, где они стоят как II и III уровень.</p>' +
    '</div>' +
    '<div class="tbl-scroll"><table><thead><tr><th>Олимпиада</th><th>Профиль</th><th>Уровень</th><th>Комментарий</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<div class="group"><h2 class="h-group">Источники</h2><ul class="src">' + D.sources.map(function(s){ return '<li><a href="' + esc(s[1]) + '" target="_blank" rel="noopener">' + esc(s[0]) + '</a></li>'; }).join("") + '</ul></div>';
}
function render(){
  renderTabs();
  VIEWS.forEach(function(v){ $("v-" + v[0]).hidden = (v[0] !== S.view); });
  ({now:renderNow, olymp:renderOlymp, cases:renderCases, cal:renderCal, list:renderList})[S.view]();
}
function go(view){
  S.view = view;
  try { history.replaceState(null, "", "#" + view); } catch(e){}
  render();
  window.scrollTo(0, 0);
}

/* ---------- события ---------- */
document.addEventListener("click", function(ev){
  var t = ev.target.closest("[data-view],[data-f],[data-jump],[data-reset]");
  if (!t) return;
  if (t.dataset.view) return go(t.dataset.view);
  if (t.dataset.f){ S[t.dataset.f] = t.dataset.v; return render(); }
  if (t.dataset.jump){
    if (t.dataset.jump === "olymp"){ S.og = t.dataset.g; S.lv = "all"; S.os = "all"; } else { S.cg = t.dataset.g; S.cs = "all"; }
    S.q = ""; $("q").value = "";
    return go(t.dataset.jump);
  }
  if (t.dataset.reset){ S.og = S.lv = S.os = S.cg = S.cs = "all"; S.q = ""; $("q").value = ""; return render(); }
});
document.addEventListener("change", function(ev){ if (ev.target.id === "past"){ S.past = ev.target.checked; render(); } });
$("q").addEventListener("input", function(ev){
  S.q = ev.target.value.trim().toLowerCase();
  if (S.q && (S.view === "now" || S.view === "list")) S.view = (fo().length || !fc().length) ? "olymp" : "cases";
  else if (S.q && S.view === "olymp" && !fo().length && fc().length) S.view = "cases";
  else if (S.q && S.view === "cases" && !fc().length && fo().length) S.view = "olymp";
  render();
});
$("foot").innerHTML =
  '<p>Данные проверены ' + esc(D.checked) + '. Статусы регистрации указаны на эту дату; «сколько осталось» в календаре пересчитывается каждый день.</p>' +
  '<p>Всего в справочнике: ' + D.olymp.length + ' олимпиадных строк, ' + D.cases.length + ' кейс-чемпионатов и конкурсов, ' + D.deadlines.length + ' дат. Перед подачей заявки сверяйте срок на сайте организатора.</p>';
render();
})();
</script>

</body></html>
